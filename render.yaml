services:
  - type: web
    name: uneed-malang
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn website_user.app_user:app --bind 0.0.0.0:$PORT
    envVars:
      - key: UNEED_ENV
        value: production
      - key: UNEED_COOKIE_SECURE
        value: "true"
      - key: UNEED_SECRET_KEY
        generateValue: true
